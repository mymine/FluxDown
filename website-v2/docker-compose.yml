# 官网（根部署）。反代：https://fluxdown.com/ → 127.0.0.1:4322（旧域名 fluxdown.zerx.dev 同指此端口，登录入口反代 302 到新域名）；
# 旧地址 /v1/（已下线的旧站存档）与 /v2/（预览期）由反代 301 到根。
# project / 镜像 / 容器名 / 宿主端口沿用预览期命名与分配；改动须同步服务器反代与 deploy.sh 的兜底清理。
name: fluxdown-v2
services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 站点挂载前缀（构建期固化进产物）；默认空串 = 根部署，子路径部署时设 SITE_BASE=/xxx
        SITE_BASE: ${SITE_BASE-}
    image: fluxdown-website-v2:latest
    container_name: fluxdown-website-v2
    restart: unless-stopped
    # 只给本机反代用：反代写入的 X-Client-IP / X-Client-Country 是可信访客信息，容器端口不得直接对外。
    ports:
      - "127.0.0.1:4322:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      # 从 .env 文件读取敏感配置（不提交到 Git）
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - AFDIAN_USER_ID=${AFDIAN_USER_ID}
      - AFDIAN_TOKEN=${AFDIAN_TOKEN}
    env_file:
      - .env
    healthcheck:
      # busybox wget 会先解析 localhost 到 ::1，而 node 只监听 IPv4，必须用 127.0.0.1
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321${SITE_BASE-}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
