name = "fluxdown-oss-cdn"
main = "oss-proxy.js"
compatibility_date = "2026-10-01"
workers_dev = false
# dl.fluxdown.com 为现行下载域名；dl-fluxdown.zerx.dev 保留给旧客户端 / 已分发链接。
# wrangler deploy 以此列表为准同步自定义域，删掉某项会解绑对应域名。
routes = [
  { pattern = "dl.fluxdown.com", custom_domain = true },
  { pattern = "dl-fluxdown.zerx.dev", custom_domain = true },
]

[vars]
OSS_BUCKET = "zerx-lab"
OSS_ENDPOINT = "oss-cn-beijing.aliyuncs.com"
OSS_RELEASE_PREFIX = "FluxDownRelease"
# auto 下载失败只回退这个仓库；必须与官网 GITHUB_REPO 保持一致。
GITHUB_REPO = "zerx-lab/FluxDown"

# 密钥：wrangler secret put OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
