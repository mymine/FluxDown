name = "fluxdown-oss-cdn"
main = "oss-proxy.js"
compatibility_date = "2026-10-01"
workers_dev = false
# wrangler deploy 以此列表为准同步自定义域，删掉某项会解绑对应域名。
# ICP 备案后 dl-cn 改回阿里云 CDN（中国内地加速）时，先删掉这里的自定义域再改 DNS。
routes = [
  { pattern = "dl-cn.fluxdown.com", custom_domain = true },
]

[vars]
OSS_BUCKET = "zerx-lab"
OSS_ENDPOINT = "oss-cn-beijing.aliyuncs.com"
OSS_RELEASE_PREFIX = "FluxDownRelease"
# 必须等于官网 src/lib/oss.ts 的 DOWNLOAD_URL_TTL_SEC（auth_key 有效期）。
DOWNLOAD_URL_TTL_SEC = "10800"

# 密钥：wrangler secret put OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET / CN_CDN_AUTH_KEY
