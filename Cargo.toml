# This file is used for telling Rust-related tools
# where various Rust crates are.
# This also unifies `target` output folder and
# various Rust configurations.

[workspace]
resolver = "3"
members = ["native/*", "crates/*", "scripts/desktop-dev"]
exclude = ["poc/iroh-demo"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# GPUI 走 gpui-kit main（钉 commit，见下方 `[patch.crates-io]`）所锁定的 `gpui-pre` 快照；
# 升级 gpui-kit 时必须同步到它 `Cargo.toml` 里的同一 `=` 版本，否则 gpui-component 可能与
# GPUI API 不匹配。实际实现由下方 `[patch.crates-io]` 换成 gpui-fast（同名同版本的兼容壳）。
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-base = "0.8.0"
gpui-component = "0.8.0"
gpui-component-assets = { package = "gpui-kit-assets", version = "0.8.0" }
# GPUI Shell（gpui-kit 的 JS 插件 UI 运行时，未发布到 crates.io）：与上面的 gpui-kit 组件同一
# commit。关 `webview`（会引入 wry 与 gpui-fast 直连），保留 `quickjs` 引擎与 `components` 组件目录。
gpui-shell = { git = "https://github.com/longbridge/gpui-kit", rev = "4d63c733f77b6803a57d2ff56fa6f85cb751c9b4", default-features = false, features = ["quickjs", "components"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
winresource = "0.1.31"

[workspace.lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
expect_used = "deny"
let_underscore_future = "deny"
let_underscore_must_use = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[patch.crates-io]
# zerx-lab/rqbit main = 上游 ikatson/rqbit main（v9.0.1 之后）+ lingdiansr MSE
# + Android HTTPS 修复（bundled webpki 根替代需 JNI 初始化的 rustls-platform-verifier，否则 Android 上任何
# https tracker 都会 panic 掉磁力解析）+ tracker panic 隔离 + 握手超时下发到 Live 种子的 peer 连接。
librqbit = { git = "https://github.com/zerx-lab/rqbit", rev = "00374a6d772d4123f079f5adf6a1fe013e363381" }
# 上游 0.7.0 在 iOS 上编译失败（Apple 平台只放行 macOS 的按索引绑定），补丁见源码内 `FluxDown 补丁` 注释；
# 上游修复发布后删除本条与 third_party/ 副本。
librqbit-dualstack-sockets = { path = "third_party/librqbit-dualstack-sockets" }
# GPUI 核心换成 gpui-fast（Retained Mode + 滚动图层）：其 `compat/` 以 gpui-pre 同名同版本
# 再导出自身 crate，整张依赖图（含 gpui-component）共用同一 GPUI 核心。升级 gpui-kit 时
# 必须等 gpui-fast 的 compat 跟到同一快照版本，否则补丁不生效（cargo 警告 patch 未使用）。
# 渲染读取的状态须在 entity / global / ListState / ScrollHandle 内，改了要 notify 读者；
# 排查界面陈旧时用 `GPUI_VIEW_RETENTION=0`（关复用）/ `GPUI_SCROLL_LAYERS=0`（关滚动图层）对照。
gpui-pre = { git = "https://github.com/longbridge/gpui-fast", rev = "b836dd970b26830f2124b7cf91b0e19018fd12da" }
gpui-pre-platform = { git = "https://github.com/longbridge/gpui-fast", rev = "b836dd970b26830f2124b7cf91b0e19018fd12da" }
gpui-pre-macros = { git = "https://github.com/longbridge/gpui-fast", rev = "b836dd970b26830f2124b7cf91b0e19018fd12da" }
gpui-pre-sum-tree = { git = "https://github.com/longbridge/gpui-fast", rev = "b836dd970b26830f2124b7cf91b0e19018fd12da" }
# gpui-kit 0.8 起经 `gpui-kit` crate 引入 `gpui-pre-web`（仅 wasm 目标）；同样换成 compat，免得锁文件里
# 再挂一份 crates.io 的 gpui-pre-web / gpui-pre-wgpu / wgpu 29。
gpui-pre-web = { git = "https://github.com/longbridge/gpui-fast", rev = "b836dd970b26830f2124b7cf91b0e19018fd12da" }
# gpui-kit 组件统一走 main 钉 commit（gpui-shell 只存在于 git，且其 `components` 组件目录
# 必须与 FluxDown 使用的 gpui-component 是同一份类型），四个包必须同 rev。
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "4d63c733f77b6803a57d2ff56fa6f85cb751c9b4" }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "4d63c733f77b6803a57d2ff56fa6f85cb751c9b4" }
gpui-component-macros = { git = "https://github.com/longbridge/gpui-kit", rev = "4d63c733f77b6803a57d2ff56fa6f85cb751c9b4" }
gpui-kit-assets = { git = "https://github.com/longbridge/gpui-kit", rev = "4d63c733f77b6803a57d2ff56fa6f85cb751c9b4" }
# gpui-shell 的 LLRT 标准库按 crates.io 名 `rquickjs` 依赖绑定；gpui-kit 用同仓的兼容外壳把它
# 指到 Longbridge `quickjs-jit` 分叉，使 shell 与 LLRT 共享同一 VM 类型。patch 对整个工作区生效，
# 所以 engine 插件运行时（`rquickjs` full-async + parallel）也随之换成同一分叉。
rquickjs = { git = "https://github.com/longbridge/gpui-kit", rev = "4d63c733f77b6803a57d2ff56fa6f85cb751c9b4" }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

# 第三方依赖在 dev 下用 O1（workspace 成员保持 O0 便于调试）：O0 时 fluxdown-desktop 的
# `__eh_frame` 约 21.7MB，超过 macOS ld compact unwind 能编码的 16MB 偏移上限，每次链接都报
# `__eh_frame section too large`；O1 后约 11.4MB，`__text` 也从 94MB 降到 59MB。
# 更具体的 `[profile.dev.package.<name>]`（如下方 librqbit）优先于 "*"。
[profile.dev.package."*"]
opt-level = 1

# BT 数据面（逐字节 RC4、逐消息解析、MSE DH 大数运算）在 opt-level 0 下慢一个数量级：
# 本地 loopback 实测 dev 基线 36.5 CPU·s/GB、吞吐封顶 165 MB/s；仅下面 5 个 crate
# 开 O3 后 4.8 CPU·s/GB、854 MB/s。开发期跑 fluxdownd 下 BT 不再吃满多核。
[profile.dev.package.librqbit]
opt-level = 3

[profile.release]
# 全部 release 产物（GPUI 桌面端、agent、fluxdownd、CLI、原生移动端核心、nmh、
# Docker/NAS 包）共用本 profile，统一按运行期性能优先：opt-level=3 + fat LTO +
# 单 codegen 单元，换取最佳吞吐/延迟，代价是产物体积和编译时间。
# 不再用 "z"：它关闭循环向量化、压低内联阈值，BT 数据面（DH768 2.46 vs 1.60 ms）、
# 哈希/校验、GPUI 布局等热路径都会明显变慢；体积收益对下载器不划算。
opt-level = 3
# Full LTO：跨 crate 内联 + 死代码消除最彻底，同时利于速度与体积
lto = "fat"
# 单一 codegen 单元：给 LLVM 完整优化视野（牺牲并行编译速度）
codegen-units = 1
# 移除全部符号：不影响运行期性能，只减小分发体积
strip = true
# 注意：不设 panic = "abort" —— engine 的 download_manager 依赖 catch_unwind
# 恢复 task panic（见 AGENTS.md），abort 会让 panic 直接终止进程。
