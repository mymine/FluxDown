[package]
name = "fluxdown_share"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
blake3 = "1.8.7"
bytes = "1.12.1"
data-encoding = "2.11.1"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
iroh = { version = "1.4.1", features = ["unstable-net-report"] }
iroh-metrics = { version = "1.0.2", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "fs", "time"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
url = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
tempfile = "3.27.0"
