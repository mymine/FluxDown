name: Build OpenWrt mipsel_24kc

# 在 x86_64 runner 上交叉编译 FluxDown 的 OpenWrt mipsel_24kc 二进制（软浮点）。
# 手动触发，或给 tag 打 v* 时触发。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-mipsel:
    runs-on: ubuntu-latest
    env:
      TARGET: mipsel-unknown-linux-musl
      CC_TRIPLE: mipsel_unknown_linux_musl
      OPENWRT_VER: '23.05.5'
      SDK_BASE: openwrt-sdk-23.05.5-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64
      IPK_ARCH: mipsel_24kc

    steps:
      - uses: actions/checkout@v4

      - name: Rust nightly + rust-src（Tier 3 目标需 -Z build-std）
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: 安装交叉编译用的系统包
        run: sudo apt-get update && sudo apt-get install -y xz-utils file git

      - name: 缓存 OpenWrt SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/owrt-sdk.tar.xz
          key: owrt-sdk-${{ env.OPENWRT_VER }}-mipsel24kc

      - name: 下载 OpenWrt SDK（含 mipsel_24kc musl 工具链）
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 -o ~/owrt-sdk.tar.xz \
            "https://downloads.openwrt.org/releases/${OPENWRT_VER}/targets/ramips/mt7621/${SDK_BASE}.tar.xz"

      - name: 解压 SDK
        run: tar -xJf ~/owrt-sdk.tar.xz -C ~

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 构建 Web SPA（编译期内嵌进 agent）
        working-directory: web
        run: bun install --frozen-lockfile && bun run build

      - name: 应用 mips32 兼容补丁（64 位原子 → portable-atomic）
        run: |
          if [ -f patch-mips32.py ]; then
            python3 patch-mips32.py "$PWD"
          else
            echo "::error::patch-mips32.py 不在仓库根；请把它放到仓库根目录"
            exit 1
          fi

      - name: 交叉编译 fluxdown-agent + fluxdownd
        env:
          SDK_DIR: ${{ github.workspace }}/../${{ env.SDK_BASE }}
          FLUXDOWN_EMBED_WEBROOT: ${{ github.workspace }}/web/dist
        run: |
          set -euo pipefail
          SDK="$HOME/${SDK_BASE}"
          TC="$SDK/staging_dir/toolchain-mipsel_24kc_gcc-12.3.0_musl"
          export STAGING_DIR="$SDK/staging_dir"
          export PATH="$TC/bin:$PATH"
          GCC="$TC/bin/mipsel-openwrt-linux-musl-gcc"
          export CC_${CC_TRIPLE}="$GCC"
          export CXX_${CC_TRIPLE}="$TC/bin/mipsel-openwrt-linux-musl-g++"
          export AR_${CC_TRIPLE}="$TC/bin/mipsel-openwrt-linux-musl-ar"
          export RANLIB_${CC_TRIPLE}="$TC/bin/mipsel-openwrt-linux-musl-ranlib"
          export CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER="$GCC"
          export CFLAGS_${CC_TRIPLE}="-msoft-float"
          export CXXFLAGS_${CC_TRIPLE}="-msoft-float"
          export RUSTFLAGS="-C link-self-contained=no -C target-feature=+crt-static"

          # Tier-3 musl 无 Rust 自带 libunwind：用工具链 libgcc/libgcc_eh 合成一个
          SHIM="$PWD/.unwind-shim"; mkdir -p "$SHIM"
          LIBGCC_DIR="$(dirname "$("$GCC" -print-libgcc-file-name)")"
          printf 'create %s/libunwind.a\naddlib %s/libgcc.a\naddlib %s/libgcc_eh.a\nsave\nend\n' \
            "$SHIM" "$LIBGCC_DIR" "$LIBGCC_DIR" | "$TC/bin/mipsel-openwrt-linux-musl-ar" -M
          export RUSTFLAGS="$RUSTFLAGS -L native=$SHIM"

          cargo +nightly build --release -p fluxdown_agent --features web-ui \
            --target "$TARGET" -Z build-std=std,panic_unwind
          cargo +nightly build --release -p fluxdown_daemon \
            --target "$TARGET" -Z build-std=std,panic_unwind

          "$GCC" --version | head -1
          file "target/$TARGET/release/fluxdown-agent" "target/$TARGET/release/fluxdownd"

      - name: 打包 ipk + tar.gz
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION="$(git describe --tags --always | sed 's/^v//')"
          rel="target/${TARGET}/release"
          mkdir -p dist/bin
          cp "$rel/fluxdown-agent" "$rel/fluxdownd" dist/bin/
          ./packaging/openwrt/build_ipk.sh server "$VERSION" "$PWD/dist/bin" "$IPK_ARCH" "$PWD/dist"
          tar czf "dist/fluxdown-server-${VERSION}-mipsel_24kc.tar.gz" -C dist/bin fluxdown-agent fluxdownd
          ls -la dist dist/bin

      - uses: actions/upload-artifact@v4
        with:
          name: fluxdown-mipsel_24kc
          path: dist/
          if-no-files-found: error
