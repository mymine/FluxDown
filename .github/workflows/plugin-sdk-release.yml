# 发布 fluxdown-plugin-sdk 到 npm。只由 `plugin-sdk-v*` tag 触发，与应用发布（v* tag）互不影响。
# 前置：包归属 npm 用户 `zerx-lab`（`@fluxdown` 作用域属他人），仓库 secret `NPM_TOKEN` 为该账号的发布令牌。
# 发布后通知插件索引仓同步准入规则（dist/manifest.mjs）：secret `PLUGIN_INDEX_TOKEN` 为对
# zerx-lab/fluxdown-plugin-index 有 Actions 写权限的令牌；缺失时跳过，索引仓每日定时同步兜底。
name: Plugin SDK Release

on:
  push:
    tags: ["plugin-sdk-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish fluxdown-plugin-sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/plugin-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          EXPECTED="${TAG#plugin-sdk-v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::tag ${TAG} expects version ${EXPECTED}, package.json has ${ACTUAL}"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run gen:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync the plugin index's admission rules
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_INDEX_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PLUGIN_INDEX_TOKEN not set; the index picks up ${TAG#plugin-sdk-v} on its daily sync."
            exit 0
          fi
          gh workflow run sync-validator.yml -R zerx-lab/fluxdown-plugin-index -f version="${TAG#plugin-sdk-v}"
